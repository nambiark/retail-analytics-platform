name: dbt CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'dbt/**'
      - 'infra/**'
      - '.github/workflows/dbt_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dbt/**'

jobs:
  dbt-test:
    name: Run dbt models and tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install dbt-core dbt-duckdb duckdb pandas \
                      psycopg2-binary sqlalchemy python-dotenv

      - name: Connect to Postgres and load into DuckDB
        run: |
          mkdir -p data
          python infra/load_duckdb.py

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          retail_transforms:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: "data/retail.duckdb"
                threads: 4
          PROFILE

      - name: dbt debug
        run: dbt debug
        working-directory: dbt

      - name: dbt run
        run: dbt run
        working-directory: dbt

      - name: dbt test
        run: dbt test
        working-directory: dbt

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-test-failures
          path: dbt/target/run_results.json
