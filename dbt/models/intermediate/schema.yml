version: 2

models:
  - name: int_orders_enriched
    description: Orders joined with customers, payments and items
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      # in models/intermediate/schema.yml, update the column description:
# total_payment_value: "Sum of all payments for the order. 
#   Defaults to 0 for orders with no payment record (e.g. abandoned/created status)."
      - name: total_payment_value
        tests:
          - not_null
      - name: days_to_deliver
        description: Negative means delivered before estimated date

  - name: int_order_items_enriched
    description: Order items joined with products and sellers
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
